[project]
name = "cleangs"
version = "0.1.0"
description = "Pareto-guided post-hoc cleanup of 3D Gaussian Splatting scenes (ICVGIP 2026)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/cleangs/_vendor/gsplat_colmap/LICENSE"]
authors = [
    { name = "Jyotirmaya Shivottam", email = "jyotirmaya.shivottam@niser.ac.in" },
    { name = "Om Kumar", email = "om.mitmpl2023@learner.manipal.edu" },
    { name = "Subhankar Mishra", email = "smishra@niser.ac.in" },
]
requires-python = ">=3.11,<3.13"
keywords = ["3D Gaussian Splatting", "scene cleanup", "view selection", "Pareto optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Versions are the ones used for the paper.
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0", # required by torchmetrics' LPIPS
    "gsplat==1.5.3",
    "numpy==1.26.4",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "torchmetrics==1.8.2",
    "opencv-python==4.11.0.86",
    "plyfile==1.1.3",
    "pillow==12.1.0",
    "tqdm==4.67.3",
    # COLMAP parser (cleangs._vendor.gsplat_colmap), as in gsplat's examples
    "pycolmap @ git+https://github.com/rmbrualla/pycolmap@cc7ea4b7301720ac29287dbe450952511b32125e",
    "imageio==2.37.2",
    "piexif==1.1.3",
    "typing-extensions>=4.12",
]

[project.urls]
Repository = "https://github.com/smlab-niser/clean-gs"

[project.scripts]
cleangs-select = "cleangs.select_views:main"
cleangs-filter = "cleangs.multiview_filter:main"
cleangs-evaluate = "cleangs.evaluate:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
# CleanGS needs an NVIDIA GPU; the lock file covers Linux only.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
